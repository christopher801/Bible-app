<!doctype html>
<html lang="en" data-theme="cream">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bible App</title>
    <meta name="description" content="A modern, accessible Bible reading application in Haitian Creole, Spanish, and English." />
    <meta name="theme-color" content="#FC6C26" />
    <meta name="application-name" content="Bible App" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bible" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('bible_theme');
        if (t) t = JSON.parse(t);
        if (t === 'light' || t === 'dark' || t === 'cream') {
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-bs-theme', t === 'dark' ? 'dark' : 'light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This application needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
